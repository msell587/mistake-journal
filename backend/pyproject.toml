[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mistake-journal"
version = "0.1.0"
description = "Daily writing journal for English learners that tracks your recurring mistakes and drills them."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "grammar-agent",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv.sources]
# The checking engine is the author's own grammar-agent project.
grammar-agent = { git = "https://github.com/msell587/grammar-agent.git", branch = "main" }

[tool.hatch.build.targets.wheel]
packages = ["src/mistake_journal"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
